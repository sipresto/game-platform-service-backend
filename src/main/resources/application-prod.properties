# Docker-specific configuration
spring.application.name=Game Platform Service Backend

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=create-drop
server.port=8095

# Use Docker service names
spring.rabbitmq.host=app_rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=user
spring.rabbitmq.password=password

server.forward-headers-strategy=framework

spring.datasource.url=jdbc:postgresql://app_postgres:5432/platformdb?currentSchema=game_platform
spring.datasource.password=platformSecretPassword
spring.datasource.username=platform
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.data-locations=classpath:sql/data.sql

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost/auth/realms/game_platform
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://idp_keycloak:8080/auth/realms/game_platform/protocol/openid-connect/certs

gateway.base-url=http://localhost

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.boot.autoconfigure=DEBUG