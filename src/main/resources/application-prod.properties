spring.application.name=Game Platform Service Backend
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=create-drop
server.port=8095
spring.rabbitmq.host=app_rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=user
server.forward-headers-strategy=framework
spring.datasource.url=jdbc:postgresql://app_postgres:5432/platformdb?currentSchema=game_platform
spring.datasource.username=platform
spring.jpa.show-sql=false
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true
spring.sql.init.data-locations=classpath:sql/data.sql

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://idp-keycloak:8080/auth/realms/game_platform
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://idp-keycloak:8080/auth/realms/game_platform/protocol/openid-connect/certs
app.auth.valid-issuers=http://localhost/auth/realms/game_platform,http://idp-keycloak:8080/auth/realms/game_platform

gateway.base-url=http://reverse-proxy