spring.application.name=Game Platform Service Backend
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=create-drop
server.port=8095
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5772
spring.rabbitmq.username=user
server.forward-headers-strategy=framework
spring.datasource.url=jdbc:postgresql://localhost:5544/platformdb?currentSchema=game_platform
spring.datasource.username=platform
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.data-locations=classpath:sql/data.sql
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8280/auth/realms/game_platform/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8280/auth/realms/game_platform
gateway.base-url=http://localhost:5173