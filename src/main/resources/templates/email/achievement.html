<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Achievement Unlocked</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background-color: #FF9800; color: white; padding: 20px; text-align: center; }
        .content { padding: 30px; background-color: #f9f9f9; }
        .achievement-icon { font-size: 48px; text-align: center; margin: 20px 0; }
        .footer { text-align: center; padding: 20px; font-size: 12px; color: #666; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🎉 Achievement Unlocked! 🎉</h1>
    </div>
    <div class="content">
        <p>Congratulations <span th:text="${username}">User</span>!</p>
        <div class="achievement-icon">🏆</div>
        <p>You've unlocked a new achievement:</p>
        <h3 th:text="${message}">[Achievement description]</h3>
        <p>Keep up the great work and discover more achievements!</p>
    </div>
    <div class="footer">
        <p>This is an automated message from <span th:text="${appName}">Game Platform</span>.</p>
    </div>
</div>
</body>
</html>
