<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friend Request</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background-color: #4CAF50; color: white; padding: 20px; text-align: center; }
        .content { padding: 30px; background-color: #f9f9f9; }
        .footer { text-align: center; padding: 20px; font-size: 12px; color: #666; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>New Friend Request</h1>
    </div>
    <div class="content">
        <p>Hello <span th:text="${username}">User</span>,</p>
        <p>You have received a new friend request!</p>
        <p th:text="${message}">[Friend request message]</p>
        <p>Login to your account to accept or decline the request.</p>
    </div>
    <div class="footer">
        <p>This is an automated message from <span th:text="${appName}">Game Platform</span>.</p>
        <p>If you did not expect this email, please ignore it.</p>
    </div>
</div>
</body>
</html>
