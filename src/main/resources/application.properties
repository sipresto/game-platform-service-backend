spring.application.name=Game Platform Service Backend

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=create-drop
server.port=8095

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5772
spring.rabbitmq.username=user
spring.rabbitmq.password=password

server.forward-headers-strategy=framework

spring.datasource.url=jdbc:postgresql://localhost:5544/platformdb?currentSchema=game_platform
spring.datasource.password=platformSecretPassword
spring.datasource.username=platform
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.data-locations=classpath:sql/data.sql

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost/auth/realms/game_platform/protocol/openid-connect/certs

gateway.base-url=http://localhost


