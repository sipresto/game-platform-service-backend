spring.application.name=Game Platform Service Backend

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=create-drop
server.port=8095

spring.datasource.url=jdbc:postgresql://localhost:5544/postgres?currentSchema=game_platform
spring.datasource.password=platformSecretPassword
spring.datasource.username=platform
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
# spring.sql.init.data-locations=classpath:sql/data.sql