spring.application.name=Game Platform Service Backend
server.port=8095

spring.config.import=optional:classpath:secret.properties

app.services.platform.client-id=platform-backend-service

spring.rabbitmq.connection-timeout=5000
spring.rabbitmq.template.receive-timeout=3000

spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-interval=10000
spring.rabbitmq.listener.simple.default-requeue-rejected=false

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
notification.email.from=vibegamesinfo@gmail.com
notification.email.sender-name=Game Platform