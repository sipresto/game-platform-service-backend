spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
server.port=0
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8280/auth/realms/game_platform/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8280/auth/realms/game_platform
app.auth.valid-issuers=http://localhost:8280/auth/realms/game_platform,http://idp-keycloak:8080/auth/realms/game_platform
gateway.base-url=http://localhost:5173

stripe.secret-key=test
app.services.platform.client-secret=test
spring.rabbitmq.password=test
spring.datasource.password=test
