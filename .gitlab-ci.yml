#   allow_failure: true

package-job:
  stage: package
  image: $DEFAULT_IMAGE_NAME
  before_script:
    - chmod +x ./mvnw  # Fix permission issue
  script:
    - ./mvnw package $MAVEN_CLI_OPTS -DskipTests
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 month
  rules:
    - if: $CI_DEFAULT_BRANCH == $CI_COMMIT_BRANCH && $CI_PIPELINE_SOURCE != "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "ci-test"  # Add for testing

include:
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml