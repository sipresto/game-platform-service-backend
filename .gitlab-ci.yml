stages:
  - compile
  - test
  - package

variables:
  DEFAULT_IMAGE_NAME: eclipse-temurin:25-jdk-alpine

compile-job:
  stage: compile
  image: $DEFAULT_IMAGE_NAME
  script:
    - ./mvnw compile
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_DEFAULT_BRANCH == $CI_COMMIT_BRANCH

test-job:
  stage: test
  image: $DEFAULT_IMAGE_NAME
  artifacts:
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml
  services:
    - name: docker:27-dind
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
  script:
    - ./mvnw test
# rules:
#   - if: $CI_PIPELINE_SOURCE == "merge_request_event"
#   - if: $CI_DEFAULT_BRANCH == $CI_COMMIT_BRANCH

package-job:
  stage: package
  script:
    - echo 'packaging the application'
  rules:
    - if: $CI_DEFAULT_BRANCH == $CI_COMMIT_BRANCH && $CI_PIPELINE_SOURCE != "merge_request_event"

include:
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml