stages:
  - compile
  - test
  - package

variables:
  DEFAULT_IMAGE_NAME: eclipse-temurin:21-jdk-alpine
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

cache:
  key:
    files:
      - pom.xml
  paths:
    - .m2/repository

compile-job:
  stage: compile
  image: $DEFAULT_IMAGE_NAME
  before_script:
    - chmod +x ./mvnw
  script:
    - ./mvnw compile


test-job:
  stage: test
  image: $DEFAULT_IMAGE_NAME
  needs:
    - job: compile-job
      optional: true
  services:
    - name: docker:27-dind
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
  artifacts:
    reports:
      junit:
        - target/surefire-reports/**/TEST-*.xml
  before_script:
    - chmod +x ./mvnw
  script:
    - ./mvnw test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_DEFAULT_BRANCH == $CI_COMMIT_BRANCH

maven-package-job:
  stage: package
  image: $DEFAULT_IMAGE_NAME
  services:
    - name: docker:27-dind
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apk update && apk add --no-cache docker  # Install Docker client in the image
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - chmod +x ./mvnw
  script:
    - ./mvnw spring-boot:build-image
    - docker push $CI_REGISTRY_IMAGE:latest
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

include:
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml