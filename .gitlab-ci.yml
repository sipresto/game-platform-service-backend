stages:
  - compile
  - test
  - package

variables:
  DEFAULT_IMAGE_NAME: eclipse-temurin:21-jdk-alpine
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

cache:
  key:
    files:
      - pom.xml
  paths:
    - .m2/repository

compile-job:
  stage: compile
  image: $DEFAULT_IMAGE_NAME
  before_script:
    - chmod +x ./mvnw
  script:
    - ./mvnw compile
#  rules:
#    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
#    - if: $CI_DEFAULT_BRANCH == $CI_COMMIT_BRANCH

test-job:
  stage: test
  image: $DEFAULT_IMAGE_NAME
  before_script:
    - chmod +x ./mvnw
  artifacts:
    reports:
      junit:
        - target/surefire-reports/**/TEST-*.xml
  services:
    - name: docker:27-dind
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_HOST_OVERRIDE: "docker"
    TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: "/var/run/docker.sock"
  script:
    - ./mvnw test
#  rules:
#    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
#    - if: $CI_DEFAULT_BRANCH == $CI_COMMIT_BRANCH

package-job:
  stage: package
  image: $DEFAULT_IMAGE_NAME
  before_script:
    - chmod +x ./mvnw
  script:
    - ./mvnw package -DskipTests
#  rules:
#    - if: $CI_DEFAULT_BRANCH == $CI_COMMIT_BRANCH && $CI_PIPELINE_SOURCE != "merge_request_event"

include:
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml
