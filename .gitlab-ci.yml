stages:
  - compile
  - test
  - package

variables:
  DEFAULT_IMAGE_NAME: eclipse-temurin:25-jdk-alpine

compile-job:
  stage: compile
  image: $DEFAULT_IMAGE_NAME
  before_script:
    - chmod +x ./mvnw
  script:
    - ./mvnw compile
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_DEFAULT_BRANCH == $CI_COMMIT_BRANCH

test-job:
  stage: test
  image: $DEFAULT_IMAGE_NAME
  services:
    - name: docker:27-dind  # Docker-in-Docker for Testcontainers
      alias: docker
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""  # Disable TLS for DinD
    # Testcontainers configuration
    TESTCONTAINERS_HOST_OVERRIDE: "docker"
    TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: "/var/run/docker.sock"
  before_script:
    - chmod +x ./mvnw
    # Wait for Docker to be ready
    - timeout 30s sh -c 'until docker info; do echo "Waiting for Docker..."; sleep 2; done'
  script:
    - ./mvnw test
  artifacts:
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_DEFAULT_BRANCH == $CI_COMMIT_BRANCH

package-job:
  stage: package
  image: $DEFAULT_IMAGE_NAME
  before_script:
    - chmod +x ./mvnw
  script:
    - ./mvnw package -DskipTests
    - echo 'packaging the application'
  rules:
    - if: $CI_DEFAULT_BRANCH == $CI_COMMIT_BRANCH && $CI_PIPELINE_SOURCE != "merge_request_event"

include:
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml