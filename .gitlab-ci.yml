stages:
  - compile
  - test
  - static-analysis
  - package

variables:
  DEFAULT_IMAGE_NAME: eclipse-temurin:25-jdk-alpine
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-fast --show-version"

cache:
  paths:
    - .m2/repository/
    - target/

compile-job:
  stage: compile
  image: $DEFAULT_IMAGE_NAME
  before_script:
    - chmod +x ./mvnw  # Fix permission issue
  script:
    - ./mvnw compile $MAVEN_CLI_OPTS
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_DEFAULT_BRANCH == $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_BRANCH == "ci-test"

test-job:
  stage: test
  image: $DEFAULT_IMAGE_NAME
  before_script:
    - chmod +x ./mvnw  # Fix permission issue
  artifacts:
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml
    paths:
      - target/
  services:
    - name: docker:27-dind
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
  script:
    - ./mvnw test $MAVEN_CLI_OPTS
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_DEFAULT_BRANCH == $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_BRANCH == "ci-test"

