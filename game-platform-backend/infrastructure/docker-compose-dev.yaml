name: kdg-ipj3-team20-dev

services:

  # ---------------------
  # DATABASE (POSTGRES)
  # ---------------------
  app_postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: "platform"
      POSTGRES_PASSWORD: "platformSecretPassword"
      POSTGRES_DB: "platformdb"
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5544:5432"
    networks:
      - dev
    volumes:
      - ./postgresql/data:/var/lib/postgresql/data
      - ./init-scripts/sql:/docker-entrypoint-initdb.d/

  # ---------------------
  # RABBITMQ (EVENTING)
  # ---------------------
  app_rabbitmq:
    image: rabbitmq:3.13.7-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: "user"
      RABBITMQ_DEFAULT_PASS: "password"
    ports:
      - "5772:5672"
      - "15683:15672"
    networks:
      - dev
    volumes:
      - ./rabbitmq/data:/var/lib/rabbitmq
      - ./rabbitmq/log:/var/log/rabbitmq

  # ---------------------
  # KEYCLOAK DATABASE (MYSQL)
  # ---------------------
  idp_mysql:
    image: mysql:9.0.1
    environment:
      MYSQL_ROOT_PASSWORD: "root"
      MYSQL_DATABASE: "keycloak"
      MYSQL_USER: "keycloak"
      MYSQL_PASSWORD: "password"
    volumes:
      - ./idp_mysql_data_dev:/var/lib/mysql
    ports:
      - "3407:3306"
    networks:
      - dev
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-ppassword" ]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------
  # KEYCLOAK (IDP / SSO)
  # ---------------------
  idp_keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: start-dev --http-relative-path=/auth --import-realm
    environment:
      KEYCLOAK_ADMIN: "admin"
      KEYCLOAK_ADMIN_PASSWORD: "admin"
      KC_DB: "mysql"
      KC_DB_URL_HOST: "idp_mysql"
      KC_DB_URL_DATABASE: "keycloak"
      KC_DB_URL_PORT: "3306"
      KC_DB_USERNAME: "keycloak"
      KC_DB_PASSWORD: "password"
      KC_PROXY: "edge"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME: "localhost"
      KC_HOSTNAME_PORT: "80"
    ports:
      - "8280:8080"
    networks:
      - dev
    depends_on:
      idp_mysql:
        condition: service_healthy
    volumes:
      - ./keycloak-data/dev/import:/opt/keycloak/data/import:ro

  # ---------------------
  # AI PLAYER SERVICE
  # ---------------------
  ai_player:
    image: registry.gitlab.com/kdg-ti/integratieproject-j3/teams-25-26/team4/ai-player
    pull_policy: always
    ports:
      - "8000:8000"
    networks:
      - dev

  rag_backend:
    image: registry.gitlab.com/kdg-ti/integratieproject-j3/teams-25-26/team4/chatbot-and-recommendation-system:latest
    pull_policy: always
    container_name: rag_backend
    ports:
      - "8001:8000"
    networks:
      - dev
    depends_on:
      - rag_postgres
      - rag_ollama
      - bge-m3
    environment:
      # --- Database Connection ---
      - RAG_API_URL=http://rag_backend:8000
      - POSTGRES_HOST=rag_postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=ragdb
      - POSTGRES_USER=raguser
      - POSTGRES_PASSWORD=ragpassword

      # --- Ollama / AI ---
      - OLLAMA_BASE_URL=http://rag_ollama:11434
      - CHAT_MODEL=gpt-oss:20b-cloud       # Matches what we auto-pull in rag_ollama
      - EMBEDDING_MODEL=bge-m3     # Matches what we auto-pull in rag_ollama
      - KEEP_ALIVE=-1              # Keep model loaded in memory

      # --- CORS & Security ---
      - ALLOWED_ORIGINS=* # Allow all origins for dev (fixes 'allowed_origins' error)

      # --- RAG Settings (Fixes chunk/retriever errors) ---
      - CHUNK_SIZE=800
      - CHUNK_SIZE_MIN=50
      - CHUNK_OVERLAP=100
      - RETRIEVER_K=5

      # --- File Uploads (Fixes data_path/max_file_size errors) ---
      - DATA_PATH=/data            # Where files are stored inside container
      - MAX_FILE_SIZE=52428800     # 50MB

      # --- Rate Limiting (Fixes rate_limit errors) ---
      - RATE_LIMIT_CHAT=100
      - RATE_LIMIT_CHAT_WINDOW=60
      - RATE_LIMIT_UPLOAD=50
      - RATE_LIMIT_UPLOAD_WINDOW=300
      - RATE_LIMIT_DEFAULT=100
      - RATE_LIMIT_DEFAULT_WINDOW=60

  # ------------------
  # RAG INFRASTRUCTURE
  # ------------------
  rag_ollama:
    image: ollama/ollama:latest
    container_name: rag_ollama
    ports:
      - "11434:11434"
    volumes:
      - ./rag-data/ollama:/root/.ollama
    networks:
      - dev

  rag_postgres:
    image: pgvector/pgvector:pg16
    container_name: rag_postgres
    environment:
      POSTGRES_USER: "raguser"
      POSTGRES_PASSWORD: "ragpassword"
      POSTGRES_DB: "ragdb"
    volumes:
      - ./rag-data/postgres:/var/lib/postgresql/data
      - ./rag-chatbot/db/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql

  bge-m3:
    image: mdelapenya/bge-m3:0.3.13-567m
    container_name: bge-m3
    ports:
      - "8002:8000"
    networks:
      - dev
  # ---------------------
  # Chess B and F
  # ---------------------
  app_chessgame_front:
    image: registry.gitlab.com/kdg-ti/integratieproject-j3/demo-content/chessgame/front:latest
    pull_policy: always
    ports:
      - '3333:80'
    networks:
      - dev
    depends_on:
      - app_chessgame_back
      - app_rabbitmq
      - app_postgres

  app_chessgame_back:
    image: registry.gitlab.com/kdg-ti/integratieproject-j3/demo-content/chessgame/back:latest
    pull_policy: always
    ports:
      - '8080:8080'
    networks:
      - dev
    depends_on:
      - app_postgres
      - app_rabbitmq
    environment:
      - GAME_REGISTRATION_ID=8496c496-a884-48ed-9bb3-7c3aa50fb8ca
      - DATASOURCE_URL=jdbc:postgresql://app_postgres:5432/platformdb?currentSchema=acl
      - DATASOURCE_USER=platform
      - DATASOURCE_PASSWORD=platformSecretPassword
      - RABBIT_HOST=app_rabbitmq
      - RABBIT_PORT=5672
      - RABBIT_USER=user
      - RABBIT_PASSWORD=password

networks:
  dev:
    name: dev-network-fresh
    driver: bridge
