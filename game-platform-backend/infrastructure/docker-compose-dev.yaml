name: kdg-ipj3-team20-dev

services:

  # ---------------------
  # DATABASE (POSTGRES)
  # ---------------------
  app_postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: "platform"
      POSTGRES_PASSWORD: "platformSecretPassword"
      POSTGRES_DB: "platformdb"
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5544:5432"
    networks:
      - dev
    volumes:
      - ./postgresql/data:/var/lib/postgresql/data
      - ./init-scripts/sql:/docker-entrypoint-initdb.d/

  # ---------------------
  # RABBITMQ (EVENTING)
  # ---------------------
  app_rabbitmq:
    image: rabbitmq:3.13.7-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: "user"
      RABBITMQ_DEFAULT_PASS: "password"
    ports:
      - "5772:5672"
      - "15683:15672"
    networks:
      - dev
    volumes:
      - ./rabbitmq/data:/var/lib/rabbitmq
      - ./rabbitmq/log:/var/log/rabbitmq

  # ---------------------
  # KEYCLOAK DATABASE (MYSQL)
  # ---------------------
  idp_mysql:
    image: mysql:9.0.1
    environment:
      MYSQL_ROOT_PASSWORD: "root"
      MYSQL_DATABASE: "keycloak"
      MYSQL_USER: "keycloak"
      MYSQL_PASSWORD: "password"
    volumes:
      - ./idp_mysql_data_dev:/var/lib/mysql
    ports:
      - "3407:3306"
    networks:
      - dev
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppassword"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------
  # KEYCLOAK (IDP / SSO)
  # ---------------------
  idp_keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: start-dev --http-relative-path=/auth --import-realm
    environment:
      KEYCLOAK_ADMIN: "admin"
      KEYCLOAK_ADMIN_PASSWORD: "admin"
      KC_DB: "mysql"
      KC_DB_URL_HOST: "idp_mysql"
      KC_DB_URL_DATABASE: "keycloak"
      KC_DB_URL_PORT: "3306"
      KC_DB_USERNAME: "keycloak"
      KC_DB_PASSWORD: "password"
      KC_PROXY: "edge"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME: "localhost"
      KC_HOSTNAME_PORT: "80"
    ports:
      - "8280:8080"
    networks:
      - dev
    depends_on:
      idp_mysql:
        condition: service_healthy
    volumes:
      - ./keycloak-data/dev/import:/opt/keycloak/data/import:ro

  # ---------------------
  # AI PLAYER SERVICE
  # ---------------------
  ai_player:
    image: matthiastruyzelaerekdg/integratieproject:ai-player
    platform: linux/amd64
    ports:
      - "8000:8000"
    networks:
      - dev
    restart: unless-stopped

networks:
  dev:
    name: dev-network-fresh
    driver: bridge
