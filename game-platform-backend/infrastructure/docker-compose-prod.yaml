name: kdg-ipj3-team20-prod

services:

  # ---------------------
  # DATABASE (POSTGRES)
  # ---------------------
  app_postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: "platform"
      POSTGRES_PASSWORD: "platformSecretPassword"
      POSTGRES_DB: "platformdb"
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5544:5432"
    networks:
      - prod
    volumes:
      - ./postgresql/data:/var/lib/postgresql/data
      - ./init-scripts/sql:/docker-entrypoint-initdb.d/

  # ---------------------
  # RABBITMQ (EVENTING)
  # ---------------------
  app_rabbitmq:
    image: rabbitmq:3.13.7-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: "user"
      RABBITMQ_DEFAULT_PASS: "password"
    ports:
      - "5772:5672"
      - "15683:15672"
    networks:
      - prod
    volumes:
      - ./rabbitmq/data:/var/lib/rabbitmq
      - ./rabbitmq/log:/var/log/rabbitmq

  # ---------------------
  # KEYCLOAK DATABASE (MYSQL)
  # ---------------------
  idp_mysql:
    image: mysql:9.0.1
    environment:
      MYSQL_ROOT_PASSWORD: "root"
      MYSQL_DATABASE: "keycloak"
      MYSQL_USER: "keycloak"
      MYSQL_PASSWORD: "password"
    volumes:
      - ./idp_mysql_data_prod:/var/lib/mysql
    ports:
      - "3407:3306"
    networks:
      - prod
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ---------------------
  # KEYCLOAK (IDP / SSO)
  # ---------------------
  idp-keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: start-dev --http-relative-path=/auth --import-realm
    environment:
      KEYCLOAK_ADMIN: "admin"
      KEYCLOAK_ADMIN_PASSWORD: "admin"
      KC_DB: "mysql"
      KC_DB_URL_HOST: "idp_mysql"
      KC_DB_URL_DATABASE: "keycloak"
      KC_DB_USERNAME: "keycloak"
      KC_DB_PASSWORD: "password"
      KC_PROXY: "edge"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HOSTNAME_URL: "http://localhost/auth"
      KC_LOG_LEVEL: "info"
    ports:
      - "8280:8080"
    networks:
      - prod
    depends_on:
      idp_mysql:
        condition: service_healthy
    volumes:
      - ./keycloak-data/prod/import:/opt/keycloak/data/import:ro

  # ---------------------
  # PLATFORM BACKEND
  # ---------------------
  platform_backend:
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      - "8095:8095"
    depends_on:
      - app_postgres
      - app_rabbitmq
      - idp-keycloak
    environment:
      SPRING_PROFILES_ACTIVE: prod
    networks:
      - prod
    restart: "no"

  # ---------------------
  # TIC TAC TOE BACKEND
  # ---------------------
  tictactoe_backend:
    build:
      context: ../../../tic-tac-toe-service-backend
      dockerfile: Dockerfile
    ports:
      - "8096:8096"
    depends_on:
      - app_postgres
      - app_rabbitmq
      - idp-keycloak
      - ai_player
    environment:
      SPRING_PROFILES_ACTIVE: prod
    networks:
      - prod
    restart: "no"

  # ---------------------
  # QUORIDOR BACKEND
  # ---------------------
  quoridor_backend:
    build:
      context: ../../../quoridor-service-backend
      dockerfile: Dockerfile
    ports:
      - "8097:8097"
    depends_on:
      - app_postgres
      - app_rabbitmq
      - idp-keycloak
      - ai_player
    environment:
      SPRING_PROFILES_ACTIVE: prod
    networks:
      - prod
    restart: "no"

  # ---------------------
  # AI PLAYER SERVICE
  # ---------------------
  ai_player:
    image: registry.gitlab.com/kdg-ti/integratieproject-j3/teams-25-26/team4/ai-player
    pull_policy: always
    ports:
      - "8000:8000"
    networks:
      - prod
    restart: unless-stopped

  # ---------------------
  # PLATFORM FRONTEND
  # ---------------------
  frontend:
    build:
      context: ../../../../WebstormProjects/game-platform-service-frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    networks:
      - prod
    restart: "no"

  # ---------------------
  # TIC TAC TOE FRONTEND
  # ---------------------
  tictactoe_frontend:
    build:
      context: ../../../../WebstormProjects/tic-tac-toe-service-frontend
      dockerfile: Dockerfile
    ports:
      - "3001:80"
    networks:
      - prod
    restart: "no"

  # ---------------------
  # QUORIDOR FRONTEND
  # ---------------------
  quoridor_frontend:
    build:
      context: ../../../../WebstormProjects/quoridor-service-frontend
      dockerfile: Dockerfile
    ports:
      - "3002:80"
    networks:
      - prod
    restart: "no"

  # ---------------------
  # REVERSE PROXY
  # ---------------------
  reverse-proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx-prod.conf:/etc/nginx/nginx.conf:ro
    networks:
      - prod
    depends_on:
      - platform_backend
      - tictactoe_backend
      - quoridor_backend
      - frontend
      - tictactoe_frontend
      - quoridor_frontend
      - idp-keycloak
      - app_chessgame_back
      - app_chessgame_front

  # ---------------------
  # Chess B and F
  # ---------------------
  app_chessgame_front:
    image: registry.gitlab.com/kdg-ti/integratieproject-j3/demo-content/chessgame/front:latest
    pull_policy: always
    ports:
      - '3333:80'
    networks:
      - prod
    depends_on:
      - app_chessgame_back
      - app_rabbitmq
      - app_postgres

  app_chessgame_back:
    image: registry.gitlab.com/kdg-ti/integratieproject-j3/demo-content/chessgame/back:latest
    pull_policy: always
    ports:
      - '8080:8080'
    networks:
      - prod
    depends_on:
      - app_postgres
      - app_rabbitmq
    environment:
      - GAME_REGISTRATION_ID=8496c496-a884-48ed-9bb3-7c3aa50fb8ca
      - DATASOURCE_URL=jdbc:postgresql://app_postgres:5432/platformdb?currentSchema=acl
      - DATASOURCE_USER=platform
      - DATASOURCE_PASSWORD=platformSecretPassword
      - RABBIT_HOST=app_rabbitmq
      - RABBIT_PORT=5672
      - RABBIT_USER=user
      - RABBIT_PASSWORD=password

  # ---------------------
  # ACL
  # ---------------------
  acl:
    build:
      context: ../../../acl
      dockerfile: Dockerfile
    ports:
      - "8099:8099"
    depends_on:
      - app_postgres
      - app_rabbitmq
      - platform_backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
    networks:
      - prod
    restart: "no"

networks:
  prod:
    name: prod-network
    driver: bridge
