events {
    worker_connections 1024;
}

http {
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    upstream local_frontend {
        server host.docker.internal:5173;
    }

    upstream local_platform_backend {
        server host.docker.internal:8095;
    }

    upstream local_tictactoe_backend {
        server host.docker.internal:8096;
    }

    server {
        listen 80;
        server_name localhost;

        location /health {
            add_header Content-Type text/plain;
            return 200 "Nginx running - Backend: host.docker.internal:8095";
        }

        location / {
            proxy_pass http://local_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /api/ {
            proxy_pass http://local_platform_backend/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /game/tictactoe/api/ {
            proxy_pass http://local_tictactoe_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            rewrite ^/game/tictactoe/api/(.*) /$1 break;
        }

        location /auth/ {
            proxy_pass http://host.docker.internal:8280/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 80;
        }
    }
}