name: kdg-ipj3-team20

services:
  # ---------------------
  # REVERSE PROXY
  # ---------------------
  reverse_proxy:
    build:
      context: ../../platform-reverse-proxy
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - platform_backend
      - platform_frontend
      - idp_keycloak
    networks:
      - backend
      - kc

  # ---------------------
  # DATABASE (POSTGRES)
  # ---------------------
  app_postgres:
    image: postgres:17.6-alpine
    restart: always
    environment:
      POSTGRES_USER: "platform"
      POSTGRES_PASSWORD: "platformSecretPassword"
      POSTGRES_DB: "platformdb"
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5544:5432"
    networks:
      - backend
    volumes:
      - ./postgresql/data:/var/lib/postgresql/data
      - ./init-scripts/sql:/docker-entrypoint-initdb.d/

  # ---------------------
  # RABBITMQ (EVENTING)
  # ---------------------
  app_rabbitmq:
    image: rabbitmq:3.13.7-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: "user"
      RABBITMQ_DEFAULT_PASS: "password"
    ports:
      - "5772:5672"
      - "15683:15672"
    networks:
      - backend
    volumes:
      - ./rabbitmq/data:/var/lib/rabbitmq
      - ./rabbitmq/log:/var/log/rabbitmq

  # ---------------------
  # KEYCLOAK DATABASE (MYSQL)
  # ---------------------
  idp_mysql:
    image: mysql:9.0.1
    environment:
      MYSQL_ROOT_PASSWORD: "root"
      MYSQL_DATABASE: "keycloak"
      MYSQL_USER: "keycloak"
      MYSQL_PASSWORD: "password"
    volumes:
      - ./idp_mysql_data:/var/lib/mysql
    ports:
      - "3407:3306"
    networks:
      - kc

  # ---------------------
  # KEYCLOAK (IDP / SSO)
  # ---------------------
  idp_keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: "admin"
      KEYCLOAK_ADMIN_PASSWORD: "admin"
      KC_DB: "mysql"
      KC_DB_URL_HOST: "idp_mysql"
      KC_DB_URL_DATABASE: "keycloak"
      KC_DB_USERNAME: "keycloak"
      KC_DB_PASSWORD: "password"
      KC_PROXY: "edge"
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8280:8080"  # <-- ADD THIS LINE BACK
    networks:
      - kc

  # ---------------------
  # PLATFORM BACKEND
  # ---------------------
  platform_backend:
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      - app_postgres
      - app_rabbitmq
      - idp_keycloak
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://app_postgres:5432/platformdb"
      SPRING_DATASOURCE_USERNAME: "platform"
      SPRING_DATASOURCE_PASSWORD: "platformSecretPassword"
      RABBITMQ_URL: "amqp://user:password@app_rabbitmq:5672"
      KEYCLOAK_URL: "http://idp_keycloak:8080"
    networks:
      - backend
      - kc

  # ---------------------
  # PLATFORM FRONTEND
  # ---------------------
  platform_frontend:
    build:
      context: C:/Users/ftlbv/WebstormProjects/game-platform-service-frontend
    depends_on:
      - platform_backend
    networks:
      - backend

# ---------------------
# NETWORKS
# ---------------------
networks:
  kc:
    name: kc-network
    driver: bridge
  backend:
    name: back-network
    driver: bridge